<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        .valid { color: green; }
        .invalid { color: red; }
    </style>
</head>
<body>
    <form id="myForm">
        <label for="name">Enter name:</label>
        <input type="text" id="name" placeholder="John Smith" required>
        <label for="email">Enter email:</label>
        <input type="email" id="email" placeholder="john@example.com" required>
        <label for="password">Enter password:</label>
        <input type="password" id="password" placeholder="Enter a strong password" required>
        <section id="rules" hidden>
            <p id="length" class="invalid">At least 6 characters</p>
            <p id="special" class="invalid">Must include a special character (!@#$...)</p>
            <p id="uppercase" class="invalid">Must include an uppercase letter (A-Z)</p>
        </section>
        <button id="bttn">Click</button>
    </form>
    <script>
        document.getElementById('myForm').addEventListener('submit',(event)=>{
            event.preventDefault()
            console.log('form submitted succesfully')
            window.location.href = "success.html";
        })
        document.getElementById('password').addEventListener('input',(event)=>{
            const password = event.target.value
            document.getElementById('rules').hidden = false
            const lengthOk = password.length >= 6
            const specialOk = /[!@#$%^&*(),.?":{}|<>]/.test(password)
            const upperOk = /[A-Z]/.test(password)

            document.getElementById('length').classList.toggle("valid", lengthOk)
            document.getElementById('length').classList.toggle("invalid", !lengthOk)
            document.getElementById('special').classList.toggle("valid", specialOk)
            document.getElementById('special').classList.toggle("invalid", !specialOk)
            document.getElementById('uppercase').classList.toggle("valid", upperOk)
            document.getElementById('uppercase').classList.toggle("invalid", !upperOk)
        })
    </script>
</body>
</html>
