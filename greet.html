<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings and Calculator</title>
</head>
<body>
    <form action="#">
        <label for="name">What is your Name?</label>
        <input type="text" id="name"> <br><br>
        <button id="bttn" type="button">Greet Me</button>
    </form>
    <p id="result"></p>

    <form action="#">
        <label for="num">Number 1</label>
        <input type="number" id="num"> <br><br>
        <label for="num2">Number 2</label>
        <input type="number" id="num2"> <br><br>
        
        <input type="radio" name="math" value="add">Add <br>
        <input type="radio" name="math" value="subtract">Subtract <br>
        <input type="radio" name="math" value="multiply">Multiply <br>
        <input type="radio" name="math" value="divide">Divide <br><br>
        
        <button id="select" type="button">Submit</button>
        <button id="clear" type="button">Clear</button>
    </form>
    <p id="opp"></p>
    <script>
        const name = document.getElementById('name');
        const num = document.getElementById('num');
        const num2 = document.getElementById('num2');
        const result = document.getElementById('result');
        const output = document.getElementById('opp');

        const add = (a, b) => a + b;
        const sub = (a, b) => a - b;
        const divide = (a, b) => a / b;
        const mult = (a, b) => a * b;

        document.getElementById('bttn').addEventListener('click', function(){
            result.textContent = "Greetings " + name.value;
        });

        document.getElementById('select').addEventListener('click', function(){
            const choice = document.querySelector(`[name=math]:checked`);
            const a = Number(num.value);
            const b = Number(num2.value);

            if (!choice) {
                output.textContent = "Choose a calculation.";
            } else if (choice.value == "add") {
                output.textContent = a + " + " + b + " = " + add(a, b);
            } else if (choice.value == "subtract") {
                output.textContent = a + " - " + b + " = " + sub(a, b);
            } else if (choice.value == "multiply") {
                output.textContent = a + " * " + b + " = " + mult(a, b);
            } else if (b == 0) {
                output.textContent = "Can't divide by zero.";
            } else {
                output.textContent = a + " / " + b + " = " + divide(a, b);
            }
        });

        document.getElementById('clear').addEventListener('click', function(){
            location.reload();
        });
    </script>
</body>
</html>
